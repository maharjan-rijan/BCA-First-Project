{% extends 'base.html' %}
{% block title %} Profile {% endblock %}
{% block content %}
               <div class="row">
                  <div class="col-sm-12">
                     <div class="card">
                        <div class="card-body">
                           <form method="post" enctype="multipart/form-data" action="{% url 'profile_edit' %}">
                              {% csrf_token %}
                              <div class="row">
                                 <div class="col-12">
                                    <h5 class="form-title"><span>Profile Update</span></h5>
                                    {% include 'layouts/messages.html' %}
                                 </div>
                                 <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Profile Picture</label>
                                       <input type="file" class="form-control" name="profile_pic" value="{{ user.profile_pic }}">
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>First Name</label>
                                       <input type="text" class="form-control" name = "first_name" value="{{ user.first_name }}">
                                    </div>
                                 </div>
                                  <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Last Name</label>
                                       <input type="text" class="form-control" name = "last_name" value="{{ user.last_name }}">
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Email</label>
                                       <input type="email" class="form-control" name="email" readonly value="{{ user.email }}">
                                    </div>
                                 </div>
                                   <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Username</label>
                                       <input type="text" class="form-control" name="user_name" readonly value="{{ user.username }}">
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Password</label>
                                       <p><strong>Note :</strong> If You Want to change Your Password. </p>
                                       <input type="password" class="form-control" name="password">
                                    </div>
                                 </div>
                                 <div class="col-12">
                                    <button type="submit" class="btn btn-primary">Profile Update</button>
                                 </div>
                              </div>
                           </form>
                        </div>
                     </div>
                  </div>
               </div>
{% endblock %}
