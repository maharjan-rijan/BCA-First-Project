{% extends 'base.html' %} {% block title %} Add Staff {% endblock %} 
{% block content %}
<div class="page-header">
  <div class="row align-items-center">
    <div class="col">
      <h3 class="page-title">Add Staffs</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item">
          <a href="{% url 'hod_view_staff' %}">Staff</a>
        </li>
        <li class="breadcrumb-item active">Add Staff</li>
      </ul>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-body">
        <form
          method="post"
          action="{% url 'hod_add_staff' %}"
          enctype="multipart/form-data"
        >
          {% csrf_token %}
          <div class="row">
            <div class="col-12">
              <h5 class="form-title"><span>Staff Information</span></h5>
            </div>
            <div class="col-12 col-sm-12">
              {% include 'layouts/messages.html' %}
              <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" class="form-control" name="profile_pic" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" name="first_name" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" name="last_name" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Gender</label>
                <select class="form-control" name="gender">
                  <option value="">Select Gender</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                  <option value="others">Others</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Date of Birth</label>
                <div>
                  <input
                    type="date"
                    class="form-control"
                    name="date_of_birth"
                    id="date_of_birth"
                  />
                </div>
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Address</label>
                <input type="text" class="form-control" name="address" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" name="email" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" name="username" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" name="password" />
              </div>
            </div>
            <!--                                 <div class="col-12 col-sm-12">-->
            <!--                                    <div class="form-group">-->
            <!--                                       <label>Mobile Number</label>-->
            <!--                                       <input type="text" class="form-control" name="mobile_number">-->
            <!--                                    </div>-->
            <!--                                 </div>-->
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add Staff</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const dobInput = document.getElementById("date_of_birth");

    // Today's date (YYYY-MM-DD)
    const today = new Date().toISOString().split("T")[0];

    // Allow past dates, block future dates
    dobInput.max = today;
  });
</script>

{% endblock %}
