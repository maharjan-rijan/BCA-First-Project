{% extends 'base.html' %}
{% block title %} Add Student {% endblock %}
{% block content %}
              <div class="page-header">
                  <div class="row align-items-center">
                     <div class="col">
                        <h3 class="page-title">Add Students</h3>
                        <ul class="breadcrumb">
                           <li class="breadcrumb-item"><a href="{% url 'hod_view_student' %}">Students</a></li>
                           <li class="breadcrumb-item active">Add Students</li>
                        </ul>
                     </div>
                  </div>
               </div>
               <div class="row">
                  <div class="col-sm-12">
                      {% include 'layouts/messages.html' %}
                     <div class="card">
                        <div class="card-body">
                           <form method="post" action="{% url 'hod_add_student' %}" enctype="multipart/form-data">
                              {% csrf_token %}
                              <div class="row">
                                 <div class="col-12">
                                    <h5 class="form-title"><span>Student Information</span></h5>
                                 </div>
                                  <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Profile Picture</label>
                                       <input type="file" class="form-control" name="profile_pic">
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>First Name</label>
                                       <input type="text" class="form-control" name="first_name">
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Last Name</label>
                                       <input type="text" class="form-control" name = "last_name">
                                    </div>
                                 </div>
                                  <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Gender</label>
                                       <select class="form-control" name="gender">
                                          <option value="">Select Gender</option>
                                          <option value="female">Female</option>
                                          <option value="male">Male</option>
                                          <option value="others">Others</option>
                                       </select>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Date of Birth</label>
                                       <div>
                                          <input type="date" class="form-control" name="date_of_birth">
                                       </div>
                                    </div>
                                 </div>
                                   <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Address</label>
                                       <input type="text" class="form-control" name="address">
                                    </div>
                                 </div>
                                  <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Email</label>
                                       <input type="email" class="form-control" name="email">
                                    </div>
                                 </div>
                                  <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Username</label>
                                       <input type="text" class="form-control" name="username">
                                    </div>
                                 </div>
                                  <div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Password</label>
                                       <input type="password" class="form-control" name="password">
                                    </div>
                                 </div>
                                   <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Courses</label>
                                       <select class="form-control" name="course_id">
                                          <option value="">Select Course</option>
                                           {% for i in course %}
                                          <option value="{{ i.id }}">{{ i.name }}&#32; &#40;{{i.short_name}}&#41;</option>
                                           {% endfor %}
                                       </select>
                                    </div>
                                 </div>
                                  <div class="col-12 col-sm-12">
                                    <div class="form-group">
                                       <label>Session Year</label>
                                       <select class="form-control" name="session_year_id">
                                          <option value="">Select Year</option>
                                          {% for i in session_year %}
                                          <option value="{{ i.id }}">{{ i.session_start }} to {{ i.session_end }}</option>
                                           {% endfor %}
                                       </select>
                                    </div>
                                 </div>
<!--                                 <div class="col-12 col-sm-12">-->
<!--                                    <div class="form-group">-->
<!--                                       <label>Mobile Number</label>-->
<!--                                       <input type="text" class="form-control" name="mobile_number">-->
<!--                                    </div>-->
<!--                                 </div>-->
                                 <div class="col-12">
                                    <button type="submit" class="btn btn-primary">Add Student</button>
                                 </div>
                              </div>
                           </form>
                        </div>
                     </div>
                  </div>
               </div>
{% endblock %}
