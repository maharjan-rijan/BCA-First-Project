<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
   <title>S.M.S - Login</title>

   <!-- Favicon -->
   <link rel="shortcut icon" href="{% static 'assets/img/Logos/scholarlyfavicon.png' %}">
   <!-- Google Fonts -->
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,400&amp;display=swap">
   <!-- Bootstrap CSS -->
   <link rel="stylesheet" href="{% static 'assets/plugins/Styles/css/style.min.css' %}">
   <!-- Font Awesome CSS -->
   <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
   <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">
   <!-- Custom CSS -->
   <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
   <link rel="stylesheet" href="{% static 'assets/css/login.css' %}">

</head>
<body>
<div class="main-wrapper login-body">
   <div class="login-wrapper">
      <div class="container">
         <div class="loginbox">
            <div class="login-left" style="background-color: gray;">
               <img class="img-fluid" src="{% static 'assets/img/Logos/scholarlyLogo.png' %}" alt="Logo">
            </div>
            <div class="login-right">
               <div class="login-right-wrap">
                  <h1>Login</h1>
                  <p class="account-subtitle">Access to our dashboard</p>
                  <!-- Error and success messages -->
                 {% include 'layouts/messages.html' %}
                  <!-- Login Form -->
                  <form action="{% url 'doLogin' %}" method="post">
                     {% csrf_token %}
                     <div class="form-group">
                        <input class="form-control" type="email" name="email" placeholder="Email">
                     </div>
                     <div class="form-group">
                        <input class="form-control" type="password" name="password" placeholder="Password">
                     </div>
                     <div class="form-group">
                        <button class="btn btn-primary btn-block" type="submit">Login</button>
                     </div>
                  </form>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>

<!-- jQuery -->
<script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
<!-- Bootstrap Core JS -->
<script src="{% static 'assets/js/popper.min.js' %}"></script>
<script src="{% static 'assets/plugins/Styles/js/bootstrap.min.js' %}"></script>
<!-- Custom JS -->
<script src="{% static 'assets/js/script.js' %}"></script>
</body>
</html>
